# Local development stack (04 §30, OD-16): PostgreSQL and an S3-compatible object store.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: proofline_dev
      POSTGRES_USER: proofline_owner
      POSTGRES_PASSWORD: proofline_owner_dev # local development only
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proofline_owner -d proofline_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  # Private S3-compatible storage emulator (SeaweedFS). The vendor is an implementation choice
  # (OD-14); the API only uses the ObjectStorage port. Anonymous access is denied because an
  # identity is configured. Create buckets with `pnpm storage:init`.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=128
    ports:
      - '8333:8333'
    volumes:
      - storage-data:/data
      - ./docker/storage/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  storage-data:
